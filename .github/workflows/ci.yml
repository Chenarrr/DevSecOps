name: CI


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]




jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install
      - run: npm run lint
      - run: npm run build





  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci






  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops:frontend
            ${{ secrets.DOCKERHUB_USERNAME }}/devops:frontend-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops:backend
            ${{ secrets.DOCKERHUB_USERNAME }}/devops:backend-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max





  update-k8s:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout K8s manifests repo
        uses: actions/checkout@v6
        with:
          repository: Chenarrr/k8s-Infra-
          token: ${{ secrets.GIT_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update image tags
        run: |
          sed -i "s|image: chenarrr/devops:frontend.*|image: chenarrr/devops:frontend-${{ env.SHORT_SHA }}|" frontend/frontend-deployment.yaml
          sed -i "s|image: chenarrr/devops:backend.*|image: chenarrr/devops:backend-${{ env.SHORT_SHA }}|" backend/backend-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "update images to ${{ env.SHORT_SHA }}"
          git push





  security:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops:frontend
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops:backend
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH



